title:       pasta-cod3
description: Blog di cybersecurity in italiano — stewe
baseurl:     ""
url:         "https://pasta-cod3.github.io"
author:      stewe
email:       stefano.comida@protonmail.com

# URL dei post → /posts/nome-del-post.html  (stessa struttura di prima)
permalink:   /posts/:slug.html

# Markdown
markdown:    kramdown
kramdown:
  input:               GFM
  syntax_highlighter:  rouge
  hard_wrap:           false

# Plugin attivi su GitHub Pages
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# --- Feed RSS/Atom (genera /feed.xml) ---
feed:
  path: feed.xml
  posts_limit: 30
  excerpt_only: true

# --- Sitemap (generata automaticamente da jekyll-sitemap) ---
sitemap:
  exclude:
    - "/404.html"
    - "/llms.txt"

# Il 404 non deve finire nel sitemap né avere layout (pagina non ancora
# creata: la scope semplicemente non ha effetto finche' non esiste)
defaults:
  - scope:
      path: "404.html"
    values:
      sitemap: false
      layout: null

# Cheatsheet (eWPT, eJPT...): ogni file ha il proprio permalink esplicito
# in front matter, generato dallo script di migrazione.
collections:
  cheatsheets:
    output: true

# File/cartelle da NON pubblicare
exclude:
  - "*.py"
  - "post_template.py"
  - "generate_posts.py"
  - "ISTRUZIONI.md"
  - README.md
  - Gemfile
  - Gemfile.lock
  - ".github"
  - node_modules
  # Sorgenti grezzi dei cheatsheet (eJPT/eWPT, importati come git subtree):
  # solo materiale di input per scripts/sync_cheatsheets.py, che rigenera
  # _cheatsheets/ con il front matter Jekyll. Non vanno pubblicati as-is.
  - eJPT_cheatsheet
  - eWPT_cheatsheet

# Variabili globali accessibili nei template Liquid
social:
  github:    https://github.com/pasta-cod3
  instagram: https://www.instagram.com/stewe.sec
