title:       pasta-cod3
description: Blog di cybersecurity in italiano — stewe
baseurl:     ""
url:         "https://pasta-cod3.github.io"
author:      stewe

# URL dei post → /posts/nome-del-post.html  (stessa struttura di prima)
permalink:   /posts/:slug.html

# Markdown
markdown:    kramdown
kramdown:
  input:               GFM
  syntax_highlighter:  rouge
  hard_wrap:           false

# Plugin attivi su GitHub Pages
plugins:
  - jekyll-seo-tag

# Cheatsheet (eWPT, eJPT...): ogni file ha il proprio permalink esplicito
# in front matter, generato dallo script di migrazione.
collections:
  cheatsheets:
    output: true

# File/cartelle da NON pubblicare
exclude:
  - "*.py"
  - "post_template.py"
  - "generate_posts.py"
  - "ISTRUZIONI.md"
  - README.md
  - Gemfile
  - Gemfile.lock
  - ".github"
  - node_modules
  # Sorgenti grezzi dei cheatsheet (eJPT/eWPT, importati come git subtree):
  # solo materiale di input per scripts/sync_cheatsheets.py, che rigenera
  # _cheatsheets/ con il front matter Jekyll. Non vanno pubblicati as-is.
  - eJPT_cheatsheet
  - eWPT_cheatsheet

# Variabili globali accessibili nei template Liquid
social:
  github:    https://github.com/pasta-cod3
  instagram: https://www.instagram.com/stewe.sec
